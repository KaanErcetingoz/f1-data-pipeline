
# Set the project name using lowercase characters and underscores.
# Choose a name that reflects your organization or the purpose of these models.
name: 'f1'
version: '1.0.0'

# Configure the dbt profile used by this project.
profile: 'f1'

# Specify where dbt should find each type of project file.
# For example, `model-paths` points to the directory containing the models.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # Directories removed by `dbt clean`.
  - "target"
  - "dbt_packages"


# Configure models.
# See https://docs.getdbt.com/docs/configuring-models for details.

# Build models in the `staging` directory as views in the `silver` schema.
# Individual model files can override these settings with the `{{ config(...) }}` macro.
models:
  f1:
    staging:
      +materialized: view
      +schema: silver
    
