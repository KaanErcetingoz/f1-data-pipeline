[project]
name = "f1-data-pipeline"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "dbt-duckdb>=1.10.0",
    "duckdb>=1.4.5",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["extract"]
testpaths = ["tests"]
